#app.ax-outer .pad{background:linear-gradient(180deg,#F4FCFA 0%,#FFFFFF 55%);padding-top:18px}
#app.ax-outer .pad> b{color:#173B49}
#app.ax-outer .card{background:linear-gradient(115deg,#DDF7F5 0%,#F2FCFA 58%,#E5F8E9 100%);border:1px solid #8BD8CC;border-radius:16px;box-shadow:0 4px 14px #073b3b18;color:#173B49}
#app.ax-outer .card .row>span{color:#173B49}
#app.ax-outer .card .row>span span{color:#42636B!important}
#app.ax-outer .btn{background:linear-gradient(100deg,#087E83,#0AA89D);color:#fff;border-radius:10px;font-weight:700}
#app.ax-outer .btn.g{background:linear-gradient(100deg,#087E83,#38BFA5)}
#app.ax-outer .btn.o{background:#fff;color:#087E83;border:1px solid #65CFC0}
#app.ax-outer .owner-tag{background:#A7F0E5;color:#075F60;border-radius:20px;padding:3px 9px}
#app.ax-outer hr{border:0;border-top:1px solid #B8E4DD}


/* AuctionX unified Aqua Green + Teal theme */
:root{--ax-teal:#087E83;--ax-teal2:#0AA89D;--ax-aqua:#DDF7F5;--ax-mint:#E5F8E9;--ax-deep:#07545B}
.live{background:radial-gradient(circle at 50% 0,#087E83,#063B43 76%)!important;color:#fff}
.live .bar{background:transparent!important}
.bar,.hero,.btn:not(.o),.fab,.phb,.photo-choice,.photo-choice input,.sort .on,.chips .on{background:linear-gradient(105deg,#087E83,#0AA89D)!important;color:#fff!important}
.tabs{background:#07545B!important}.tabs button.on{border-bottom-color:#8AF0DC!important}
.btn.o,.pb,.ib.d{color:#087E83!important;border-color:#65CFC0!important}
.mvp,.rib,.tg.r{background:#087E83!important;color:#fff!important}
.pts b,.photo-toggle,.photo-dialog h3{color:#087E83!important}
.photo-dialog h3{color:#087E83!important}
.card{border-color:#B8E4DD}
.hero[style*="linear-gradient(135deg,#1d2a33"]{background:linear-gradient(120deg,#087E83,#07545B)!important}
.ca-purse{color:#087E83!important}
.ca-fab{background:#087E83!important}
.ca-team{background:linear-gradient(135deg,#DDF7F5,#E5F8E9)!important;border-color:#8BD8CC!important;color:#173B49!important}
.ca-team-logo{color:#087E83!important;border-color:#65CFC0!important}
/* MVP search */
.mvp-search-panel{background:linear-gradient(120deg,#DDF7F5,#E5F8E9);border:1px solid #8BD8CC;border-radius:16px;padding:14px;margin:8px 0 14px;color:#173B49}
.mvp-search-heading{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.mvp-search-heading b{font:700 22px Oswald,sans-serif;color:#07545B}.mvp-search-heading span{font-size:13px;color:#42636B}
.mvp-search-wrap{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #65CFC0;border-radius:12px;padding:0 10px;min-height:48px}.mvp-search-wrap>span{font-size:25px;color:#087E83}.mvp-search-wrap input{border:0!important;outline:none!important;box-shadow:none!important;margin:0!important;padding:10px 2px!important;min-width:0;flex:1;background:transparent!important;color:#173B49!important}.mvp-search-wrap button{border:0;background:#DDF7F5;color:#087E83;border-radius:50%;width:30px;height:30px;font-size:22px;line-height:1;flex:none}
.mvp-empty{text-align:center;color:#527078;padding:22px 10px;background:#F2FCFA;border:1px dashed #8BD8CC;border-radius:12px}

function importFileRows(file,done){

  let rows;
  if(ext==='xlsx'||ext==='xls'){
   if(!window.XLSX)throw Error('Excel reader load नहीं हुआ। Internet connection जाँचें।');
   const wb=XLSX.read(reader.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  }else if(ext==='csv'){
   let raw=String(reader.result||'').replace(/^\uFEFF/,'');
   // Handle common UTF-16 Excel CSV exports as well as UTF-8.
   rows=csvRows(raw);
  }else throw Error('Please upload an .xlsx, .xls, or .csv file.');
  rows=rows.filter(row=>row.some(v=>String(v??'').trim()!==''));if(rows.length<2)throw Error('The file must contain a header row and at least one data row.');done(rows);
 }catch(e){toast(e.message||'File पढ़ने में समस्या हुई');}};
 reader.onerror=()=>toast('File पढ़ी नहीं जा सकी');
 if(ext==='xlsx'||ext==='xls')reader.readAsArrayBuffer(file);else reader.readAsText(file);
}

function addBidSlab2(from="",to="",step=""){const wrap=$("bidSlabs2");if(!wrap)return;const row=document.createElement("div");row.className="bid-slab-row";row.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:8px 0;align-items:center";row.innerHTML=`<input type="number" min="0" placeholder="From amount" value="${from}"><input type="number" min="0" placeholder="To amount" value="${to}"><input type="number" min="1" placeholder="Increment" value="${step}"><button type="button" class="ib d" aria-label="Remove slab" onclick="this.parentElement.remove()">×</button>`;wrap.appendChild(row)}
function readBidSlabs2(){return [...document.querySelectorAll("#bidSlabs2 .bid-slab-row")].map(r=>[...r.querySelectorAll("input")].map(x=>x.value.trim())).filter(r=>r.some(Boolean)).map(r=>({from:+r[0],to:r[1]===""?0:+r[1],inc:+r[2]}))}

function saveAuc(){
 if(!canEdit(S))return toast("Only the auction owner or Super Admin can update settings.");
 const n=$("an2").value.trim(),tc=+$("teamsCount").value,per=+$("per2").value,purse=+$("purse2").value,min=+$("min2").value,minSquad=+$("minSquad2").value;
 const bidSlabs=readBidSlabs2();
 if(!n)return toast("Enter the auction name");
 if(!Number.isInteger(tc)||tc<2||!Number.isInteger(per)||per<1||!(Number.isFinite(purse)&&purse>0&&Number.isFinite(min)&&min>0))return toast("Enter valid auction settings (at least 2 teams)");
 if(!Number.isInteger(minSquad)||minSquad<0||minSquad>per)return toast("Minimum squad must be a whole number between 0 and the squad size");
 if(!bidSlabs.length||bidSlabs.some(x=>!(x.inc>0)||x.from<0||(x.to!==0&&x.to<x.from)))return toast("Add valid bid slabs with amount ranges and increments");
 if(S.teams.some(t=>t.squad.length>per))return toast("Squad size cannot be lower than a team's current players");
 if(S.teams.some(t=>(S.purse-t.purse)>purse))return toast("New purse cannot be lower than points already spent by a team");
 if(tc<S.teams.length&&S.teams.slice(tc).some(t=>t.squad.length))return toast("Remove sold players from the last teams before reducing team count");
 const delta=purse-S.purse;S.teams.forEach(t=>{if(delta){t.purse+=delta;t.hist=t.hist||[];t.hist.push({t:Date.now(),type:"Purse Adjustment",amt:delta,bal:t.purse})}});
 if(tc<S.teams.length)S.teams.splice(tc);
 while(S.teams.length<tc){const i=S.teams.length+1,name=`Team ${String(i).padStart(2,"0")}`;S.teams.push({name,short:`T${i}`,purse,squad:[],hist:[{t:Date.now(),type:"Initial",amt:purse,bal:purse}]})}
 const date=$("auctionDate2").value,time=$("auctionTime2").value;
 S.name=n;S.venue=$("ve2").value.trim();S.date=date&&time?date+"T"+time:"";S.visibility=$("visibility2").value;S.per=per;S.purse=purse;S.min=min;S.bidSlabs=bidSlabs;S.inc=bidSlabs[0].inc;S.unit=$("unit2").value;S.rules=S.rules||{};S.rules.minSquad=minSquad;S.rules.captain=$("captainRule2").value;S.rules.reserve=$("reserveRule2").value;S.rules.allowRebid=$("allowRebid2").value==="yes";S.rules.unsold=$("unsoldRule2").value;S.rules.customNotes=$("notes2").value.trim();
 if(S.leader>=S.teams.length)S.leader=-1;save();go("detail","teams");toast("Auction settings updated")
}

function sortP(a){const b=[...a],nm=(x,y)=>x.name.localeCompare(y.name),num=(x,y)=>pn(x)-pn(y),cn=p=>{const c=catOf(p);return c?c.name:"\uffff"};if(psort==="az")b.sort(nm);else if(psort==="za")b.sort((x,y)=>nm(y,x));else if(psort==="cat")b.sort((x,y)=>cn(x).localeCompare(cn(y))||num(x,y));else b.sort(num);return b}

/* live auction */
const live_p=()=>S.cur>=0?S.players[S.cur]:null;
function pending(){return S.players.filter(p=>p.status==="pending")}
function pick(id){S.cur=id;{const c=catOf(S.players[id]);if(S.inc0==null)S.inc0=S.inc;S.inc=c?c.inc:S.inc0}S.bid=S.players[id].base;S.leader=-1;S.log=[];manual=false;save();render()}
function rnd(){const a=pending();if(!a.length)return toast("No players available");pick(a[Math.random()*a.length|0].id)}
function open_(){const p=live_p();if(!p)return toast("Pick a player first");if(p.status!=="pending"){toast("Player already sold or unsold");return}return p}
function tap(t){
  const p=open_();if(!p||t===S.leader)return;const T=S.teams[t];const pc=catOf(p);if(pc&&pc.mx>0&&have(T,pc.id)>=pc.mx)return toast(T.name+" already has "+pc.mx+" "+pc.name+" players");
  if(T.squad.length>=S.per)return toast(T.name+" has a full squad");
  const step=bidIncrement(S.bid);const nb=S.leader<0?S.bid:S.bid+step;
  if(nb>maxBid(t))return toast(T.name+" cannot afford "+fmt(nb));
  S.log.push([S.bid,S.leader]);S.bid=nb;S.leader=t;save();render();
}
function up(){const p=open_();if(!p)return;if(S.leader<0)return toast("Tap a team to start the bidding");
  const step=bidIncrement(S.bid);if(S.bid+step>maxBid(S.leader))return toast("Max bid reached");S.log.push([S.bid,S.leader]);S.bid+=step;save();render()}
function down(){const p=open_();if(!p)return;const step=bidIncrement(S.bid);if(S.bid-step<p.base)return toast("Already at the base price");S.log.push([S.bid,S.leader]);S.bid-=step;save();render()}
function undo(){const p=open_();if(!p)return;const l=S.log.pop();if(!l)return toast("Nothing to undo");S.bid=l[0];S.leader=l[1];save();render()}
function edit(){const p=open_();if(!p)return;modal("",(v,ic,tg)=>{const n=+v;
  if(!(n>0)||(!ic&&n<p.base))return toast("Bid must be at least "+p.base);if(S.leader>=0&&n>(ic?S.teams[S.leader].purse:maxBid(S.leader)))return toast("Above the leading team’s max bid");S.log.push([S.bid,S.leader]);S.bid=n;p.icon=ic;p.tag=ic?tg:null;save();render()},S.bid,true)}
function sold(){
  const p=open_();if(!p)return;if(S.leader<0)return toast("Select a team first");const T=S.teams[S.leader];
  const amt=cutOf(p)||S.bid;if(amt>T.purse)return toast(T.name+" does not have "+fmt(amt)+" points");modal("Are you sure you want to sell "+p.name+" to "+T.name+" for "+fmt(amt)+(amt!==S.bid?" (icon/reserved points)":"")+"?",()=>{
  hist(T);T.purse-=amt;T.hist.push({t:Date.now(),type:"Sold",amt:-amt,bal:T.purse,name:p.name});T.squad.push(p.id);p.status="sold";p.team=S.leader;p.price=amt;save();render();after()});
}
function unsold(){const p=open_();if(!p)return;if(S.rules?.unsold==="final"&&S.rules?.allowRebid===false){/* final unsold is intentionally terminal */}p.status="unsold";S.leader=-1;S.log=[];save();render();after()}

function addBidSlab(from="",to="",step=""){const wrap=$("bidSlabs");if(!wrap)return;const row=document.createElement("div");row.className="bid-slab-row";row.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:8px 0;align-items:center";row.innerHTML=`<input type="number" min="0" placeholder="From amount" value="${from}"><input type="number" min="0" placeholder="To amount" value="${to}"><input type="number" min="1" placeholder="Increment" value="${step}"><button type="button" class="ib d" aria-label="Remove slab" onclick="this.parentElement.remove()">×</button>`;wrap.appendChild(row)}
function readBidSlabs(){return [...document.querySelectorAll("#bidSlabs .bid-slab-row")].map(r=>[...r.querySelectorAll("input")].map(x=>x.value.trim())).filter(r=>r.some(Boolean)).map(r=>({from:+r[0],to:r[1]===""?0:+r[1],inc:+r[2]}))}
function bidIncrement(amount){const slabs=S.bidSlabs||[];const slab=slabs.find(x=>amount>=x.from&&(x.to===0||amount<=x.to));return slab?.inc||S.inc||500}

 const value=String(v??"");if(!value)return toast("Nothing to copy");

function openTeamAddMenu(){const m=$("modal");m.hidden=false;m.innerHTML=`<div class="photo-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><h3>Add Team</h3><div style="display:grid;gap:12px;margin-top:18px"><button class="btn" onclick="openSingleTeamForm()">＋ Add Single Team</button><button class="btn o" onclick="openBulkTeamForm()">＋ Add Bulk Team</button></div><button class="pb" style="width:100%;margin-top:14px" onclick="closeTeamModal()">Cancel</button></div>`;m.onclick=closeTeamModal}
function closeTeamModal(){const m=$("modal");m.hidden=true;m.innerHTML=""}
function openSingleTeamForm(){const m=$("modal");m.innerHTML=`<div class="photo-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><h3>Add Single Team</h3><input id="tn1" placeholder="Team name"><input id="ts1" maxlength="5" placeholder="Short name (2 to 5 letters)"><button class="btn" onclick="addTeam1();closeTeamModal()">Add Team</button><button class="pb" style="width:100%;margin-top:8px" onclick="openTeamAddMenu()">Back</button></div>`}
function openBulkTeamForm(){const m=$("modal");m.innerHTML=`<div class="photo-dialog" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><h3>Add Bulk Teams</h3><textarea id="tb" rows="5" placeholder="Team names, one per line or separated by commas"></textarea><button class="btn" onclick="addTeams();closeTeamModal()">Add Teams</button><button class="pb" style="width:100%;margin-top:8px" onclick="openTeamAddMenu()">Back</button></div>`}
function captureNewPlayerForm(){const g=id=>$(id)?.value??"";TP.pnewForm={name:g("pn"),role:g("ps"),cat:g("pc"),age:g("pa"),base:g("pbv"),bulk:g("pb")};}

function preSold(i){const T=S.teams[i],id=$("pp").value,pv=$("pv").value;if(id==="")return toast("No player available");const p=S.players[+id],n=pv===""?p.base:+pv;if(!(n>=0))return toast("Enter a valid price");if(T.squad.length>=S.per)return toast(T.name+" has a full squad");const c=catOf(p);if(c&&c.mx>0&&have(T,c.id)>=c.mx)return toast(T.name+" already has "+c.mx+" "+c.name+" players");if(n>T.purse)return toast("Not enough points");hist(T);T.purse-=n;T.hist.push({t:Date.now(),type:"Pre-sold",amt:-n,bal:T.purse,name:p.name});T.squad.push(p.id);Object.assign(p,{status:"sold",team:i,price:n,pre:true});save();render();toast(p.name+" added to "+T.name)}
function vCats(){const cs=S.cats||[];return `<div class="ca-category-list">${cs.map((c,i)=>{const count=S.players.filter(p=>p.cat===c.id).length;const emblem=/plat/i.test(c.name)?"♛":/gold/i.test(c.name)?"★":/silv/i.test(c.name)?"✦":"◆";return `<article class="ca-category-card"><div class="ca-category-emblem">${emblem}</div><div class="ca-category-main"><div class="ca-category-head"><b>${esc(c.name)}</b><button class="ca-category-count" onclick="cv=${c.id};go('cat')">Players: ${count} →</button></div><div class="ca-category-bids"><span>Min Bid <b>${fmt(c.min)}</b></span><span>Increment <b>${fmt(c.inc)}</b></span></div><div class="ca-category-limit">Players per team: <b>Min ${c.mn||"No limit"} / Max ${c.mx||"No limit"}</b></div></div><div class="ca-category-actions"><button class="ib e" aria-label="Edit category" onclick="ce=${c.id};go('catform')">✎</button><button class="ib d" aria-label="Delete category" onclick="delCat(${c.id})">🗑</button></div></article>`}).join("")||`<p style="text-align:center;color:var(--mute)">No categories yet. Tap + to add one.</p>`}</div>`}
function vCatForm(){const c=ce!=null?(S.cats||[]).find(x=>x.id===ce):null,m=c?c.min:S.min,i=c?c.inc:(S.inc0??S.inc);return `<div class="bar"><button onclick="go('detail','cats')" aria-label="Back">‹</button><span>${c?"EDIT":"ADD"} CATEGORY</span></div><div class="pad"><input id="cn" placeholder="Category Name" value="${esc(c?c.name:"")}"><label for="cm">Minimum Bid</label><input id="cm" type="number" value="${m}" oninput="$('w1').textContent=words(this.value)"><div id="w1" class="ws">${words(m)}</div><label for="ci">Increment</label><input id="ci" type="number" value="${i}" oninput="$('w2').textContent=words(this.value)"><div id="w2" class="ws">${words(i)}</div><input id="cx" type="number" placeholder="Max Players (Per team)" value="${c?c.mx:""}"><input id="cmn" type="number" placeholder="Min players (Per team)" value="${c?c.mn:""}"><label for="cr">Reserved/Icon points (cut from team purse)</label><input id="cr" type="number" placeholder="e.g. 15000" value="${c?iconCut(c):""}"><button class="btn" onclick="saveCat()">${c?"Update":"Add"} Category</button></div>`}
function vCat(){const c=(S.cats||[]).find(x=>x.id===cv);if(!c)return `<div class="pad">Category not found</div>`;const L=S.players.filter(p=>p.cat===c.id),free=S.players.filter(p=>p.cat==null&&p.status==="pending");return `<div class="bar"><button onclick="go('detail','cats')" aria-label="Back">‹</button><span>${esc(c.name)}</span></div><div class="pad"><div class="card"><b>Add player to ${esc(c.name)}</b><select id="cp">${free.map(p=>`<option value="${p.id}">#${pn(p)} ${esc(p.name)}</option>`).join("")||"<option value=''>No uncategorised players</option>"}</select><button class="btn" onclick="toCat(${c.id})">Add to category</button></div>${L.map(p=>`<div class="card row"><span><b>#${pn(p)} ${esc(p.name)}</b><br><span style="color:var(--mute)">${p.skill} · Base ${fmt(p.base)} · ${p.status}</span> ${rtag(p)}</span>${p.status==="pending"?`<button class="ib d" aria-label="Remove from category" onclick="fromCat(${p.id})">✕</button>`:""}</div>`).join("")||`<p style="text-align:center;color:var(--mute)">No player found</p>`}</div>`}
function saveCat(){const g=i=>$(i).value.trim(),n=i=>+$(i).value;const name=g("cn"),min=n("cm"),inc=n("ci"),mx=g("cx")===""?0:n("cx"),mn=g("cmn")===""?0:n("cmn"),rp=$("cr").value===""?defCut(name):n("cr");if(!name||!(Number.isFinite(min)&&min>0)||!(Number.isFinite(inc)&&inc>0)||!Number.isInteger(mx)||mx<0||!Number.isInteger(mn)||mn<0||!Number.isFinite(rp)||rp<0)return toast("Enter valid category values; player limits must be whole numbers when provided");if(mx>0&&mn>mx)return toast("Min players cannot be more than max players");if(ce!=null){const soldInCat=S.players.filter(p=>p.cat===ce&&p.status==="sold").length;if(mx>0&&mx<soldInCat)return toast("Max players cannot be lower than the number already sold in this category");}S.cats=S.cats||[];if(ce!=null){const c=S.cats.find(x=>x.id===ce);Object.assign(c,{name,min,inc,mn,mx,rp});S.players.forEach(p=>{if(p.cat===c.id&&p.status==="pending")p.base=min})}else S.cats.push({id:S.cats.length?Math.max(...S.cats.map(c=>c.id))+1:0,name,min,inc,mn,mx,rp});ce=null;save();go("detail","cats");toast("Category saved")}
function delCat(id){modal("Delete this category? Its players become uncategorised.",()=>{S.cats=S.cats.filter(c=>c.id!==id);S.players.forEach(p=>{if(p.cat===id)p.cat=null});save();render()})}
function toCat(cid){const id=$("cp").value;if(id==="")return toast("No player available");const p=S.players[+id],c=S.cats.find(x=>x.id===cid);p.cat=cid;p.base=c.min;save();render()}

function cnv(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c}

/* Four-page AuctionX mobile shell */
const PROFILE_KEY="auctionx-profile-v1";
function profileData(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||"{}")||{}}catch(e){return {}}}
function topNav(page){topPage=page;view="home";S=null;render()}
function auctionCode(a){return a?.accessCode||""}
async function openAuctionCard(i){const a=AL[i];if(!a)return;if(a.visibility==="private"&&!isOwner(a)){if(!AUTH_USER){openCloudLogin();return toast("Private auction ke liye login karein.")}const code=prompt("Private Auction — Enter 6-digit code");if(code===null)return;return openPrivateByCode(code)}openAuction(i)}
async function findAuctionByCode(){const raw=$("viewAuctionCode")?.value||"",code=raw.replace(/\D/g,"");if(!/^\d{6}$/.test(code))return toast("Enter a valid 6-digit code");if(!AUTH_USER){openCloudLogin();return toast("Code se auction kholne ke liye login karein.")}return openPrivateByCode(code)}
function vViewAuctionCode(){return `<header class="ax-title-head"><button aria-label="Back" onclick="topNav('home')">‹</button>VIEW AUCTION</header><main class="ax-page"><h2 style="font-size:22px;margin:12px 0 24px">Enter your auction code</h2><input id="viewAuctionCode" inputmode="numeric" maxlength="6" placeholder="123456" style="font-size:24px;letter-spacing:5px;text-align:center;font-weight:700" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)"><button class="btn" style="width:100%;margin-top:20px" onclick="findAuctionByCode()">Get Auction Details</button><p class="hint" style="line-height:1.8;margin-top:24px">• Private Auction code is 6 digits.<br>• Login is required before entering a private code.<br>• The auction code is provided by the organizer.</p></main>`}
function topCard(a,i){const owner=canEdit(a);return `<div class="ax-auction-card" role="button" tabindex="0" onclick="openAuctionCard(${i})"><span class="ax-card-date"><span>▣ &nbsp;${a.date?esc(fdt(a.date)):"Auction details"}</span><span class="ax-card-top-right"><b>♙ &nbsp;${a.per||15} PI/Team</b><button class="ax-card-bookmark" aria-label="${a.bookmarked?"Remove bookmark":"Bookmark auction"}" title="Bookmark" onclick="event.stopPropagation();AL[${i}].bookmarked=!AL[${i}].bookmarked;topAuctionMenu=-1;save();render()">${a.bookmarked?"★":"♧"}</button></span></span><span class="ax-card-main">${av(a.logo,"🏏","ax-logo")}<span><strong>${esc(a.name||"Untitled Auction")}</strong><small>${a.teams?.length||0} Teams · ${a.players?.length||0} Players · ${(a.visibility||"public")==="private"?"🔒 Private · Code required":"🌐 Public"}</small></span></span><span class="ax-card-foot"><span>◉ &nbsp;${fmt(a.purse||100000)} Pts/Team</span><span style="display:inline-flex;align-items:center;gap:6px"><b>${a.bookmarked?"★ Bookmarked":"Free"}</b>${owner?`<span class="ax-card-more-wrap"><button class="ax-card-more" aria-label="Auction options" aria-expanded="${topAuctionMenu===i}" onclick="event.stopPropagation();topAuctionMenu=topAuctionMenu===${i}?-1:${i};render()">⋮</button>${topAuctionMenu===i?`<span class="ax-card-menu" role="menu"><button role="menuitem" onclick="event.stopPropagation();topAuctionMenu=-1;openAuction(${i});go('aedit')">Edit</button><button class="danger" role="menuitem" onclick="event.stopPropagation();topAuctionMenu=-1;delAuc(${i})">Delete</button></span>`:""}</span>`:""}</span></span></div>`}
function vTopHome(){let today=AL.filter(a=>a.status==="active"),mine=AL.filter(a=>canEdit(a));return `<header class="ax-head"><span class="ax-brand">AUCTION<span>X</span></span><span class="ax-head-actions"><button onclick="toast('Search is available in auction lists')">⌕</button><button aria-label="Notifications" title="Notifications" onclick="toast('No new notifications')">🔔</button></span></header><main class="ax-page"><div class="ax-section-title">Today's Auction <button onclick="topNav('my')">View all</button></div>${today.length?today.map(a=>topCard(a,AL.indexOf(a))).join(""):`<div class="ax-empty-mini">No live auction scheduled right now.</div>`}<div class="ax-section-title">My Auction <button onclick="topNav('my')">View all</button></div>${mine.slice(0,2).map(a=>topCard(a,AL.indexOf(a))).join("")||`<div class="ax-empty-mini">Create your first auction to see it here.</div>`}<div class="ax-actions"><button onclick="newAuction()">＋ Create Auction</button><button onclick="topNav('viewcode')">View Auction</button></div></main>`}
function vTopMy(){let list=myTab==="my"?AL.filter(a=>canEdit(a)):AL;return `<header class="ax-title-head">MY AUCTION <button aria-label="Search" onclick="let q=prompt('Search auction');if(q){const a=AL.findIndex(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(a>=0)openAuction(a);else toast('No matching auction found')}">⌕</button></header><div class="ax-tabs"><button class="${myTab==='my'?'active':''}" onclick="myTab='my';render()">MY</button><button class="${myTab==='participate'?'active':''}" onclick="myTab='participate';render()">PARTICIPATE</button></div><main class="ax-page">${list.map(a=>topCard(a,AL.indexOf(a))).join("")||`<div class="ax-empty"><b>▤</b><strong>${myTab==='my'?'No auctions yet':'No auctions to participate'}</strong><span>${myTab==='my'?'Create an auction using the + button':'Available auctions will appear here'}</span></div>`}</main><button class="ax-fab" onclick="newAuction()">＋</button>`}
function vTopBookmarks(){let list=AL.map((a,i)=>({a,i})).filter(x=>x.a.bookmarked);return `<header class="ax-title-head">BOOKMARK AUCTION</header><main class="ax-page ax-bookmarks">${list.map(x=>topCard(x.a,x.i)).join("")||`<div class="ax-empty"><b>♧</b><strong>No bookmarks yet</strong><span>Start bookmarking auctions to see them here</span></div>`}</main>`}
function vTopProfile(){let p=profileData();return `<header class="ax-title-head">PROFILE</header><main class="ax-page ax-profile"><div class="ax-avatar">${esc((p.name||"U").trim().charAt(0).toUpperCase())}</div><label>Name<input id="profileName" value="${esc(p.name||"")}" placeholder="Enter your name"></label><label>Email<input id="profileEmail" type="email" value="${esc(p.email||"")}" placeholder="Enter email"></label><label>Phone number<input id="profilePhone" type="tel" maxlength="10" value="${esc(p.phone||"")}" placeholder="10-digit phone number"></label><label>City<input id="profileCity" value="${esc(p.city||"")}" placeholder="Enter city"></label><button class="ax-save" onclick="saveProfile()">Save</button></main>`}
function saveProfile(){let p={name:$('profileName').value.trim(),email:$('profileEmail').value.trim(),phone:$('profilePhone').value.trim(),city:$('profileCity').value.trim()};localStorage.setItem(PROFILE_KEY,JSON.stringify(p));toast('Profile saved');render()}
function vTopShell(){let body=topPage==='home'?vTopHome():topPage==='my'?vTopMy():topPage==='bookmarks'?vTopBookmarks():topPage==='viewcode'?vViewAuctionCode():vTopProfile();return `<div class="ax-shell">${body}<nav class="ax-nav"><button class="${topPage==='home'?'sel':''}" onclick="topNav('home')"><i>⌂</i>Home</button><button class="${topPage==='my'?'sel':''}" onclick="topNav('my')"><i>⚒</i>My Auction</button><button class="${topPage==='bookmarks'?'sel':''}" onclick="topNav('bookmarks')"><i>♧</i>Bookmarks</button><button class="${topPage==='profile'?'sel':''}" onclick="topNav('profile')"><i>♙</i>Profile</button></nav></div>`}

function render(){
  const topLevel=view==="home";
  $("app").classList.toggle("ax-outer",topLevel);
  $("app").innerHTML=topLevel?vTopShell():!S?vCreate():({create:vCreate,detail:vDetail,team:vTeam,live:vLive,board:vBoard,catform:vCatForm,cat:vCat,pedit:vPEdit,thist:vHist,tedit:vTEdit,aedit:vAEdit,gallery:vGallery})[view]();
}
render();
cloudStatus();
initCloud();

// PWA: install prompt (supported browsers) and offline app-shell caching.
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  let installButton = document.getElementById("installAppButton");
  if (!installButton) {
    installButton = document.createElement("button");
    installButton.id = "installAppButton";
    installButton.className = "install-app";
    installButton.type = "button";
    installButton.textContent = "Install App";
    document.body.appendChild(installButton);
    installButton.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.style.display = "none";
    });
  }
  installButton.style.display = "block";
});
window.addEventListener("appinstalled", () => {
  const b = document.getElementById("installAppButton");
  if (b) b.style.display = "none";
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.warn("Offline support could not be enabled:", err);
    });
  });
}

</script>
</body>
</html>
